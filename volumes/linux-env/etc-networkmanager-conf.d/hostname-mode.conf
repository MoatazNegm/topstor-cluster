# Disable NetworkManager's automatic hostname update from DHCP.
# Without this, every `nmcli conn up` rewrites /etc/hostname with whatever
# the DHCP server sends in option 12 (or the connection's ipv4.dhcp-hostname).
# `hostname-mode=none` makes NM leave the system hostname alone, so the values
# `docker_setup.sh` writes (localhost after reset, dhcpXXXXXX after init/local)
# survive subsequent `nmcli conn up` calls.
#
# This file lives on the host and is bind-mounted read-only into the
# zfs container at /etc/NetworkManager/conf.d/ — see docker-compose.yml.
[main]
hostname-mode=none
